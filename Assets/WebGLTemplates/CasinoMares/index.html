<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#140b0e">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Casino Mares">
    <title>Casino Mares</title>
    <link rel="manifest" href="TemplateData/manifest.webmanifest">
    <link rel="icon" href="TemplateData/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="TemplateData/icon-180.png">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="game">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="loading">
        <div class="loading-title">Casino Mares</div>
        <div class="loading-subtitle">A cozy casino for cats</div>
        <div class="loading-bar"><div id="loading-fill"></div></div>
        <div id="loading-status">Loading…</div>
        <div class="home-screen-hint hidden">
          <div class="hint-title">Play full screen</div>
          <div>Tap <svg class="share-icon" viewBox="0 0 20 24" aria-label="Share"><path d="M10 2v13M5.5 6.5 10 2l4.5 4.5M6 10H3.5v11.5h13V10H14"/></svg> Share in Safari, then <b>Add to Home Screen</b>, and open Casino Mares from there.</div>
        </div>
      </div>
      <div id="rotate">
        <div class="rotate-phone"></div>
        <div>Turn your phone sideways to play</div>
        <div class="home-screen-hint hidden">
          <div class="hint-title">Play full screen</div>
          <div>Tap <svg class="share-icon" viewBox="0 0 20 24" aria-label="Share"><path d="M10 2v13M5.5 6.5 10 2l4.5 4.5M6 10H3.5v11.5h13V10H14"/></svg> Share in Safari, then <b>Add to Home Screen</b>, and open Casino Mares from there.</div>
        </div>
      </div>
      <div id="error" class="hidden"></div>
    </div>
    <script>
      var touch = window.matchMedia("(pointer: coarse)").matches ||
        (navigator.maxTouchPoints > 0 && window.matchMedia("(hover: none)").matches);
      if (touch)
        document.body.classList.add("touch");

      var standalone = window.matchMedia("(display-mode: standalone)").matches ||
        window.matchMedia("(display-mode: fullscreen)").matches || navigator.standalone;
      // iPhones, and iPads without the fullscreen API (iPadOS Safari says it's a Mac): there the home screen is the
      // only way to play without the browser bars.
      var canFullscreen = document.fullscreenEnabled || document.webkitFullscreenEnabled;
      var iOS = /iPhone|iPod/.test(navigator.userAgent) ||
        (/iPad|Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1 && !canFullscreen);
      // On the title screen and on the "turn your phone sideways" screen.
      if (iOS && !standalone)
        document.querySelectorAll(".home-screen-hint").forEach(function (hint) { hint.classList.remove("hidden"); });

      // The title screen stays up at least this long, so there's time to read it (a cached game loads in a moment).
      var splashUntil = performance.now() + 5000;
      function hideSplash() {
        var loading = document.getElementById("loading");
        loading.classList.add("fading");
        document.body.classList.add("ready");
        setTimeout(function () { loading.classList.add("hidden"); }, 600);
      }

      // Safari's pinch zoom ignores user-scalable=no.
      document.addEventListener("gesturestart", function (e) { e.preventDefault(); });

      // A tap reloads where the game can't carry on by itself: in full screen a phone shows no reload button.
      function showError(message, tapToReload) {
        var box = document.getElementById("error");
        box.textContent = message;
        box.classList.remove("hidden");
        if (tapToReload) {
          box.classList.add("reload");
          box.onclick = function () { location.reload(); };
        }
      }

      // ?debug=1 also keeps a log of page events and errors in the page itself: the size changes around turning the
      // phone and going full screen, the GPU, lost WebGL contexts and the game's console errors. Unlike the game's
      // own debug line, it stays readable when the game draws nothing (or only a colour).
      var debugMode = new URLSearchParams(location.search).get("debug");
      var debug = debugMode == "1" || debugMode == "perf";
      var debugBox = null;
      function debugLog(line) {
        if (!debug)
          return;
        if (!debugBox) {
          debugBox = document.createElement("div");
          debugBox.id = "debug-log";
          document.body.appendChild(debugBox);
        }
        var row = document.createElement("div");
        row.textContent = (performance.now() / 1000).toFixed(1) + "s " + String(line).slice(0, 200);
        debugBox.appendChild(row);
        while (debugBox.childNodes.length > (touch ? 5 : 14))
          debugBox.removeChild(debugBox.firstChild);
      }
      if (debug) {
        ["error", "warn"].forEach(function (level) {
          var original = console[level];
          console[level] = function () {
            debugLog(level + ": " + Array.prototype.join.call(arguments, " "));
            return original.apply(console, arguments);
          };
        });
        // The game's own measurements (?debug=perf, PerfProbe.cs) get a box of their own on the right: the game's HUD
        // covers its debug corner on a phone, and this page draws over the game.
        var perfBox = null;
        function perfLog(line) {
          if (!perfBox) {
            perfBox = document.createElement("div");
            perfBox.id = "perf-log";
            document.body.appendChild(perfBox);
          }
          if (line.indexOf("seated") == 0 || line.indexOf("started") == 0)
            perfBox.textContent = "";
          var row = document.createElement("div");
          row.textContent = line;
          perfBox.appendChild(row);
        }
        if (debugMode == "perf")
          perfLog("perf: sit down to start");
        var log = console.log;
        console.log = function () {
          var line = Array.prototype.join.call(arguments, " ");
          var at = line.indexOf("[PerfProbe] ");
          if (at >= 0)
            perfLog(line.substring(at + 12).split("\n")[0]);
          // The phone's render scale stepping up or down (AutoRenderScale.cs).
          at = line.indexOf("[RenderScale] ");
          if (at >= 0)
            debugLog(line.substring(at + 1).split("\n")[0].replace("] ", ": "));
          return log.apply(console, arguments);
        };
        window.addEventListener("error", function (e) { debugLog("page error: " + e.message); });
        window.addEventListener("unhandledrejection", function (e) { debugLog("rejected: " + e.reason); });
        var sizes = function () {
          var c = document.getElementById("unity-canvas");
          return "window " + innerWidth + "x" + innerHeight + " dpr " + devicePixelRatio +
            " canvas " + c.width + "x" + c.height;
        };
        debugLog(sizes());
        window.addEventListener("resize", function () { debugLog("resize: " + sizes()); });
        if (screen.orientation)
          screen.orientation.addEventListener("change", function () { debugLog("orientation " + screen.orientation.type); });
        document.addEventListener("fullscreenchange", function () { debugLog("fullscreen " + (document.fullscreenElement ? "on" : "off")); });
        document.addEventListener("visibilitychange", function () { debugLog("page " + document.visibilityState); });
        // The game resizes its canvas on its next frame, so a size change shows up here a moment after the resize.
        var lastCanvas = "";
        setInterval(function () {
          var c = document.getElementById("unity-canvas");
          var size = c.width + "x" + c.height;
          if (size != lastCanvas)
            debugLog("canvas now " + size);
          lastCanvas = size;
        }, 500);
      }

      // Phones and tablets go full screen and lock to landscape on a tap, where the browser allows it (Android, iPad;
      // iPhone Safari has no fullscreen API, hence the home screen hint). It keeps trying on each tap until it works
      // once; after that, leaving full screen is the player's choice (the pause menu has a button to go back).
      var game = document.getElementById("game");
      var wantFullscreen = touch && !standalone;
      function goFullscreen() {
        var request = game.requestFullscreen || game.webkitRequestFullscreen;
        if (!wantFullscreen || !request || document.fullscreenElement || document.webkitFullscreenElement)
          return;
        var result = request.call(game, { navigationUI: "hide" });
        if (result && result.then)
          result.then(function () {
            wantFullscreen = false;
            if (screen.orientation && screen.orientation.lock)
              screen.orientation.lock("landscape").catch(function () {});
          }).catch(function () {});
        else
          wantFullscreen = false;
      }
      // Capture phase, so the game's own touch handlers can't keep the tap from reaching this.
      document.addEventListener("touchend", goFullscreen, true);

      // Phones resume a page rather than reload it when it comes back to the front (a home screen web app stays
      // suspended like any app), so it would keep running whatever build it first loaded. Each build rewrites this page,
      // so when the page comes back and the server has a newer one, start over with it.
      function pageStamp() {
        return fetch(location.pathname, { method: "HEAD", cache: "no-store" })
          .then(function (r) { return r.ok ? r.headers.get("ETag") || r.headers.get("Last-Modified") : null; })
          .catch(function () { return null; });
      }
      var loadedStamp = null;
      pageStamp().then(function (stamp) { loadedStamp = stamp; });
      function reloadIfRebuilt() {
        if (document.visibilityState != "visible" || !loadedStamp)
          return;
        pageStamp().then(function (stamp) {
          if (stamp && stamp != loadedStamp)
            location.reload();
        });
      }
      document.addEventListener("visibilitychange", reloadIfRebuilt);
      window.addEventListener("pageshow", function (e) { if (e.persisted) reloadIfRebuilt(); });

      // Keys typed into the page's text boxes (WebTextInput.cs) are theirs: the game listens to keys page-wide and
      // would cancel them. Added before the game starts, so this runs before its own listeners. Key releases still
      // reach the game, so a key pressed before the box took the keyboard doesn't stay down there. Esc cancels the box.
      ["keydown", "keypress"].forEach(function (type) {
        window.addEventListener(type, function (e) {
          if (!e.target || !e.target.classList || !e.target.classList.contains("cm-text-input"))
            return;
          e.stopImmediatePropagation();
          if (type == "keydown" && e.key == "Escape")
            e.target.dispatchEvent(new Event("cm-cancel"));
        }, true);
      });

      var buildUrl = "Build";
      // The deploy script (Tools/deploy_pages.py) points buildUrl at jsDelivr, which sends the game files much faster
      // than GitHub Pages on some networks. jsDelivr fetches a file from GitHub again once it has dropped it from its
      // cache, and for the big files that can fail (a 503 after half a minute or more). Any build file it doesn't send
      // comes from this page's own copy instead.
      var mirrorUrl = "Build";
      // How long jsDelivr gets to start sending a file. A cached one starts at once; one it has to fetch from GitHub
      // first can take 10-20 s, which is still quicker than GitHub Pages where that is slow.
      var cdnWaitMs = 25000;
      if (buildUrl != mirrorUrl) {
        // Unity's loader downloads every file with fetch().
        var pageFetch = window.fetch;
        window.fetch = function (resource, init) {
          if (typeof resource != "string" || resource.indexOf(buildUrl + "/") != 0)
            return pageFetch.apply(window, arguments);
          var file = resource.substring(buildUrl.length + 1);
          var useMirror = function (reason) {
            console.warn("jsDelivr " + reason + " for " + file + ", loading it from GitHub Pages");
            return pageFetch(mirrorUrl + "/" + file, init);
          };
          var abort = new AbortController();
          var timer = setTimeout(function () { abort.abort(); }, cdnWaitMs);
          return pageFetch(resource, Object.assign({}, init, { signal: abort.signal })).then(function (response) {
            clearTimeout(timer);
            // 304: the game's own cache asked whether its copy is still current.
            return response.ok || response.status == 304 ? response : useMirror("answered " + response.status);
          }, function (error) {
            clearTimeout(timer);
            return useMirror(abort.signal.aborted ? "sent nothing in " + cdnWaitMs / 1000 + " s" : "failed (" + error + ")");
          });
        };
      }
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_WASM
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        // The chip balance lives in a file in persistentDataPath (IndexedDB); keep it across visits.
        autoSyncPersistentDataPath: true,
        // Unity keeps the data file in the browser and by default asks the server each visit whether it's still
        // current, which waits on jsDelivr like a download does. The deployed page's buildUrl names the commit that
        // holds the files, so a saved copy is always current there: use it without asking. A local build changes its
        // files at the same address, so it keeps asking.
        cacheControl: function (url) {
          if (url != config.dataUrl)
            return "no-store";
          return buildUrl != mirrorUrl ? "immutable" : "must-revalidate";
        },
        showBanner: function (message, type) {
          if (type == "error")
            showError(message);
          else
            console.warn(message);
        },
        // Unity's default is a blocking alert(); show errors in the page instead.
        errorHandler: function (error, url, line) {
          showError("Something went wrong: " + String(error && error.message || error) + "\nReload the page to play again.");
          return true;
        },
      };

      // Phone screens have up to 3 pixels per CSS pixel. Two is plenty for the UI, and the 3D view is scaled down
      // further by the render pipeline.
      if (touch)
        config.devicePixelRatio = Math.min(window.devicePixelRatio || 1, 2);

      // Desktop builds use DXT textures. Phones and tablets can't decode those in hardware, so the build script adds
      // a second data file with ASTC textures; load it where only ASTC is supported. ?astc=1 loads it wherever the GPU
      // can decode ASTC (an Apple Silicon Mac can), to compare the two on one machine.
      function textureVariant() {
        var gl = document.createElement("canvas").getContext("webgl2");
        if (!gl)
          return "desktop";
        var astc = !!gl.getExtension("WEBGL_compressed_texture_astc");
        var s3tc = !!gl.getExtension("WEBGL_compressed_texture_s3tc");
        if (debug) {
          var info = gl.getExtension("WEBGL_debug_renderer_info");
          debugLog("GPU " + gl.getParameter(info ? info.UNMASKED_RENDERER_WEBGL : gl.RENDERER) +
            ", float targets " + (gl.getExtension("EXT_color_buffer_float") ? "yes" : "no") +
            ", half float targets " + (gl.getExtension("EXT_color_buffer_half_float") ? "yes" : "no"));
        }
        // This context only answered those questions; free it rather than keep a second one next to the game's.
        var lose = gl.getExtension("WEBGL_lose_context");
        if (lose)
          lose.loseContext();
        if (astc && new URLSearchParams(location.search).get("astc") == "1")
          return "mobile";
        if (s3tc)
          return "desktop";
        return astc ? "mobile" : "desktop";
      }

      function pickDataUrl() {
        var mobileUrl = config.dataUrl.replace(/\.data/, "_Mobile.data");
        if (textureVariant() != "mobile")
          return Promise.resolve(config.dataUrl);
        // A desktop-only build has no mobile data file. Asked of the page's own copy, which answers at once.
        return fetch(mirrorUrl + mobileUrl.substring(buildUrl.length), { method: "HEAD" })
          .then(function (response) { return response.ok ? mobileUrl : config.dataUrl; })
          .catch(function () { return config.dataUrl; });
      }

      var canvas = document.getElementById("unity-canvas");
      // The right mouse button turns the camera, so no context menu over the game.
      canvas.addEventListener("contextmenu", function (e) { e.preventDefault(); });
      // The browser can take the GPU away from a page (a driver reset, or running out of graphics memory), and Unity
      // can't rebuild its graphics afterwards: say so instead of leaving a frozen picture or a flat colour.
      canvas.addEventListener("webglcontextlost", function () {
        debugLog("WebGL context lost");
        showError("The browser stopped the game's graphics.\nTap here to reload and play again.", true);
      });
      canvas.addEventListener("webglcontextrestored", function () { debugLog("WebGL context restored"); });
      var fill = document.getElementById("loading-fill");
      var statusLabel = document.getElementById("loading-status");

      // Unity reports no progress until every file has started to arrive, which can take half a minute when one falls
      // back to GitHub Pages. So the bar creeps along by itself, slowing down as it nears 60%, until the real progress
      // passes it, and it eases towards whichever is ahead rather than jumping.
      var loadingStart = performance.now();
      var realProgress = 0, shownProgress = 0, gameLoaded = false, lastFrame = loadingStart;
      function drawProgress(now) {
        var creep = 0.6 * (1 - Math.exp(-(now - loadingStart) / 15000));
        var target = gameLoaded ? 1 : Math.max(realProgress, creep);
        shownProgress += (target - shownProgress) * (1 - Math.exp(-(now - lastFrame) / 150));
        lastFrame = now;
        fill.style.width = (100 * shownProgress) + "%";
        statusLabel.textContent = realProgress < 0.9 && !gameLoaded ?
          "Loading… " + Math.round(100 * shownProgress) + "%" : "Shuffling the cards…";
        if (!gameLoaded || shownProgress < 0.999)
          requestAnimationFrame(drawProgress);
        else
          fill.style.width = "100%";
      }
      requestAnimationFrame(drawProgress);

      function startGame() {
        createUnityInstance(canvas, config, function (progress) {
          realProgress = progress;
        }).then(function (instance) {
          window.unityInstance = instance;
          gameLoaded = true;
          setTimeout(hideSplash, Math.max(0, splashUntil - performance.now()));
        }).catch(function (message) {
          showError(message);
        });
      }

      // The loader is a script tag, not a fetch, so its fallback to the page's own copy is here.
      function loadLoader(base) {
        var script = document.createElement("script");
        script.src = base + "/{{{ LOADER_FILENAME }}}";
        script.onload = startGame;
        script.onerror = function () {
          if (base == mirrorUrl)
            return showError("Could not load the game files.");
          console.warn("jsDelivr didn't send the loader, loading it from GitHub Pages");
          loadLoader(mirrorUrl);
        };
        document.body.appendChild(script);
      }

      pickDataUrl().then(function (dataUrl) {
        config.dataUrl = dataUrl;
        window.cmTextureFormat = dataUrl.indexOf("_Mobile.data") >= 0 ? "ASTC" : "DXT";
        loadLoader(buildUrl);
      });
    </script>
  </body>
</html>
